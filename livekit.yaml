# Video server for meetings (LiveKit). The keys come from .env (LIVEKIT_API_KEY / LIVEKIT_API_SECRET).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Finds the server's public address by itself. On a private network (office server, VPN), set it instead:
  # node_ip: 192.168.1.20
  use_external_ip: true
logging:
  level: info
room:
  empty_timeout: 300
